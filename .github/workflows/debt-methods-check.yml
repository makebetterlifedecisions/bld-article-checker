name: Debt guide desktop and mobile
on:
  push:
    paths: ['check-debt-methods.mjs', '.github/workflows/debt-methods-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node check-debt-methods.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debt-methods-evidence
          path: results/
          retention-days: 14
