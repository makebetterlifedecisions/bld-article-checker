name: HDMI guide full check
# Recheck Adrian-supplied affiliate replacements: 27 October 2026
on:
  push:
    paths: ['.github/workflows/hdmi-guide-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: google-chrome --version
      - name: Measure and capture whole article
        run: |
          cat > check-iphone-galaxy-guide.mjs <<'BLD_SCRIPT'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('results',{recursive:true});
          const browser=await chromium.launch({channel:'chrome'});
          const results=[];
          for(const config of [{w:1366,col:280},{w:1366,col:320},{w:360},{w:390},{w:480},{w:680},{w:1280},{w:1366}]){
           const tag=`${config.w}${config.col?'-column-'+config.col:''}`;
           const ctx=await browser.newContext({viewport:{width:config.w,height:1000}});const page=await ctx.newPage();
           await page.goto('https://www.betterlifedecisions.com.au/blogs/buying-guides/do-you-need-hdmi-2-1',{waitUntil:'domcontentloaded'});
           await page.locator('#bld-hdmi-guide').waitFor();
           if(await page.locator('#bld-hdmi-guide .quick-pick').count()!==3)throw new Error('Wrong card count');
           if(await page.locator('#bld-hdmi-guide a.quick-button,#bld-hdmi-guide a.buy-button').count()!==18)throw new Error('Wrong control count');
           if(config.col)await page.evaluate(w=>{const el=document.querySelector('#bld-hdmi-guide');el.style.setProperty('width',w+'px','important');el.style.setProperty('max-width',w+'px','important')},config.col);
           for(let y=0;y<await page.evaluate(()=>document.documentElement.scrollHeight);y+=850){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(80)}
           await page.waitForTimeout(1000);
           const data=await page.evaluate(async()=>{
           const root=document.querySelector('#bld-hdmi-guide');const box=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
           const imageProbes=await Promise.all([...root.querySelectorAll('img')].map(e=>new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({src:i.src,loaded:true});i.onerror=()=>resolve({src:i.src,loaded:false});i.src=e.getAttribute('src')||e.dataset.src||'';if(!i.src)resolve({src:'',loaded:false})})));
           const controls=[...root.querySelectorAll('a:is(.quick-button,.buy-button),.quick-status')].map(e=>({text:e.textContent,box:box(e),color:getComputedStyle(e).color,bg:getComputedStyle(e).backgroundColor,padding:getComputedStyle(e).padding,overflow:e.scrollWidth>e.clientWidth+1||e.scrollHeight>e.clientHeight+1,children:[...e.children].map(x=>({text:x.textContent,box:box(x),color:getComputedStyle(x).color,font:getComputedStyle(x).fontSize}))}));
           const cards=[...root.querySelectorAll('.quick-pick')].map(e=>({box:box(e),rows:[...e.children].map(x=>({cls:x.className,box:box(x),overflow:x.scrollWidth>x.clientWidth+1}))}));
           return {imageProbes,viewport:innerWidth,article:box(root),pageOverflow:document.documentElement.scrollWidth>innerWidth+1,controls,cards,images:[...document.querySelectorAll('.bld-article__featured img,#bld-hdmi-guide img')].map(e=>({src:e.currentSrc,loaded:e.complete&&e.naturalWidth>0,native:[e.naturalWidth,e.naturalHeight],box:box(e)})),sources:[...root.querySelectorAll('.sources a')].map(e=>({text:e.textContent,color:getComputedStyle(e).color})),headings:root.querySelectorAll('h2').length,stacks:[...root.querySelectorAll('.buy-row')].map(box)};
           });
           for(let y=0;y<await page.evaluate(()=>document.documentElement.scrollHeight);y+=850){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(80);await page.screenshot({path:`results/${tag}-scroll-${String(y).padStart(6,'0')}.jpg`,type:'jpeg',quality:65})}
           data.states=[];
           for(const loc of [...await page.locator('#bld-hdmi-guide a:is(.quick-button,.buy-button)').all(),...await page.locator('#bld-hdmi-guide section.sources a').all()]){
           await loc.scrollIntoViewIfNeeded();await loc.hover();const hover=await loc.evaluate(e=>({purchase:e.matches('.quick-button,.buy-button'),color:getComputedStyle(e).color,children:[...e.children].map(x=>getComputedStyle(x).color)}));await loc.focus();const focus=await loc.evaluate(e=>({purchase:e.matches('.quick-button,.buy-button'),color:getComputedStyle(e).color,outline:getComputedStyle(e).outline,focused:document.activeElement===e}));const r=await loc.boundingBox();await page.mouse.move(r.x+r.width/2,r.y+r.height/2);await page.mouse.down();const active=await loc.evaluate(e=>getComputedStyle(e).color);await page.mouse.move(1,1);await page.mouse.up();data.states.push({hover,focus,active});
           }
           const cdp=await ctx.newCDPSession(page);await cdp.send('DOM.enable');await cdp.send('CSS.enable');const doc=await cdp.send('DOM.getDocument');const nodes=await cdp.send('DOM.querySelectorAll',{nodeId:doc.root.nodeId,selector:'#bld-hdmi-guide a'});for(const nodeId of nodes.nodeIds)await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:['visited']});data.visited=await page.locator('#bld-hdmi-guide a').evaluateAll(es=>es.map(e=>({purchase:e.matches('.quick-button,.buy-button'),color:getComputedStyle(e).color,children:[...e.children].map(x=>getComputedStyle(x).color)})));await cdp.detach();
           await page.evaluate(()=>{getSelection()?.removeAllRanges();scrollTo(0,0)});await page.screenshot({path:`results/${tag}-full.png`,fullPage:true});
           await page.locator('#bld-hdmi-guide .quick-picks').screenshot({path:`results/${tag}-cards.png`});
           await page.locator('#bld-hdmi-guide section.sources').screenshot({path:`results/${tag}-sources.png`});
           data.failures=[];
           for(const st of data.states){const expected=st.hover.purchase?'rgb(255, 255, 255)':'rgb(7, 95, 155)';if(st.hover.color!==expected||st.focus.color!==expected||st.active!==expected||!st.focus.focused||st.focus.outline.includes('none'))data.failures.push('link state');}
           for(const st of data.visited){const expected=st.purchase?'rgb(255, 255, 255)':'rgb(7, 95, 155)';if(st.color!==expected||st.children.some(c=>c!==expected))data.failures.push('visited state');}
           if(data.sources.some(s=>s.color!=='rgb(7, 95, 155)'))data.failures.push('source colors');
           const labels=data.cards.map(c=>c.rows[2].box);if(Math.max(...labels.map(x=>x.w))-Math.min(...labels.map(x=>x.w))>1)data.failures.push('label widths');

           if(data.pageOverflow)data.failures.push('page overflow');for(const c of data.cards)for(const row of c.rows)if(row.overflow)data.failures.push('card text overflow '+row.cls);
           for(const c of data.controls){if(Math.abs(c.box.h-64)>.5)data.failures.push('control height '+c.text);if(c.overflow)data.failures.push('control overflow '+c.text);for(const child of c.children){if(child.box.x<c.box.x+5||child.box.right>c.box.right-5||child.box.y<c.box.y+5||child.box.bottom>c.box.bottom-5)data.failures.push('control content padding '+c.text)}if(c.color!=='rgb(255, 255, 255)')data.failures.push('control color '+c.text)}
           for(let i=0;i<6;i++){const rows=data.cards.map(c=>c.rows[i].box);if(Math.max(...rows.map(x=>x.y))-Math.min(...rows.map(x=>x.y))>1)data.failures.push('row alignment '+i);if(i===2&&Math.max(...rows.map(x=>x.h))-Math.min(...rows.map(x=>x.h))>1)data.failures.push('label heights')}
           if(data.images.some(x=>x.box.w>0&&x.box.h>0&&!x.loaded)||data.imageProbes.some(x=>!x.loaded))data.failures.push('image not loaded');
           if(data.stacks.some(x=>x.w>320.5||x.x<data.article.x||x.right>data.article.right))data.failures.push('stack width');
           results.push({tag,...data});console.log('CHECK '+tag+' '+JSON.stringify({viewport:data.viewport,articleWidth:data.article.w,failures:data.failures,controlHeights:[...new Set(data.controls.map(x=>x.box.h))],labelHeights:data.cards.map(x=>x.rows[2].box.h),imagesLoaded:data.images.every(x=>x.loaded),headings:data.headings,states:data.states}));
           fs.writeFileSync('results/report.json',JSON.stringify(results,null,2));await ctx.close();if(data.failures.length)break;
          }
          await browser.close();if(results.some(x=>x.failures.length))process.exitCode=1;
          
          BLD_SCRIPT
          node check-iphone-galaxy-guide.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdmi-guide-check
          path: results/
          retention-days: 14

