name: Pets unpublished draft layout QA
on:
  push:
    branches: [pets-draft-fixtures-20261122]
    paths: ['pets-feeder-fixtures.json', 'pets-drafts-complete-qa.mjs', '.github/workflows/pets-drafts-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: google-chrome --version
      - run: node pets-drafts-complete-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pets-ten-draft-layout-evidence
          path: results/
          retention-days: 3
