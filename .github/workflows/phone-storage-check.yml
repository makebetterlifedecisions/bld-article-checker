name: Phone storage article QA
# Recheck narrow card actions and long heading after observed 280px overflow.
on:
  push:
    paths:
      - '.github/workflows/phone-storage-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node phone-storage-check.mjs
        env:
          ARTICLE_URL: https://www.betterlifedecisions.com.au/blogs/buying-guides/how-much-phone-storage-do-you-need
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-storage-qa
          path: results/
          retention-days: 14
