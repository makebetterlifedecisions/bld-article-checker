name: Laptop desktop article QA
# Verify final model-code fix, hero, content counts and source styling.
on:
  push:
    paths:
      - '.github/workflows/laptop-desktop-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node laptop-desktop-check.mjs
        env:
          ARTICLE_URL: https://www.betterlifedecisions.com.au/blogs/buying-guides/laptop-vs-desktop-computer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laptop-desktop-qa
          path: results/
          retention-days: 14
