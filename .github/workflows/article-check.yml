name: BLD article check
on:
  push:
    paths: ['check.mjs', 'package.json', '.github/workflows/article-check.yml', 'article-url.txt']
  workflow_dispatch:
    inputs:
      article_url:
        description: Exact public BLD article URL
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check article
        run: node check.mjs
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bld-article-check
          path: results/
          retention-days: 14
