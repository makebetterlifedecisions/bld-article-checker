name: Smart TV systems guide desktop and mobile
on:
  push:
    paths: ['check-smart-tv-systems.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node check-smart-tv-systems.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-tv-systems-evidence
          path: results/
          retention-days: 14
