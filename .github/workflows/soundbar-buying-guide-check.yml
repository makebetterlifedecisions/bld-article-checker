name: Soundbar buying guide full check
on:
  push:
    paths: ['.github/workflows/soundbar-buying-guide-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Measure and capture whole article
        run: |
          cat > check-soundbar-buying-guide.mjs <<'BLD_SCRIPT'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('results',{recursive:true});
          const browser=await chromium.launch();
          const results=[];
          for(const config of [{w:360},{w:390},{w:480},{w:680},{w:1280},{w:1366},{w:1366,col:280},{w:1366,col:320}]){
           const tag=`${config.w}${config.col?'-column-'+config.col:''}`;
           const ctx=await browser.newContext({viewport:{width:config.w,height:1000}});const page=await ctx.newPage();
           await page.goto('https://www.betterlifedecisions.com.au/blogs/buying-guides/how-to-choose-a-soundbar',{waitUntil:'domcontentloaded'});
           await page.locator('#bld-soundbar-guide').waitFor();
           if(config.col)await page.addStyleTag({content:`#bld-soundbar-guide{width:${config.col}px!important;max-width:${config.col}px!important}`});
           for(let y=0;y<await page.evaluate(()=>document.documentElement.scrollHeight);y+=850){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(35)}
           await page.waitForTimeout(1000);
           const data=await page.evaluate(()=>{
           const root=document.querySelector('#bld-soundbar-guide');const box=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
           const controls=[...root.querySelectorAll('a.quick-button,.quick-status')].map(e=>({text:e.textContent,box:box(e),color:getComputedStyle(e).color,bg:getComputedStyle(e).backgroundColor,padding:getComputedStyle(e).padding,overflow:e.scrollWidth>e.clientWidth+1||e.scrollHeight>e.clientHeight+1,children:[...e.children].map(x=>({text:x.textContent,box:box(x),color:getComputedStyle(x).color,font:getComputedStyle(x).fontSize}))}));
           const cards=[...root.querySelectorAll('.quick-pick')].map(e=>({box:box(e),rows:[...e.children].map(x=>({cls:x.className,box:box(x),overflow:x.scrollWidth>x.clientWidth+1}))}));
           return {viewport:innerWidth,article:box(root),pageOverflow:document.documentElement.scrollWidth>innerWidth+1,controls,cards,images:[...document.querySelectorAll('.bld-article__featured img,#bld-soundbar-guide img')].map(e=>({src:e.currentSrc,loaded:e.complete&&e.naturalWidth>0,native:[e.naturalWidth,e.naturalHeight],box:box(e)})),sources:[...root.querySelectorAll('.sources a')].map(e=>({text:e.textContent,color:getComputedStyle(e).color})),headings:root.querySelectorAll('h2').length,stacks:[...root.querySelectorAll('.bldp-buy-row')].map(box)};
           });
           data.states=[];
           for(const loc of [page.locator('#bld-soundbar-guide a.quick-button').first(),page.locator('#bld-soundbar-guide .bldp-buy-row a').first(),page.locator('#bld-soundbar-guide .sources a').first()]){
           await loc.scrollIntoViewIfNeeded();await loc.hover();const hover=await loc.evaluate(e=>({color:getComputedStyle(e).color,children:[...e.children].map(x=>getComputedStyle(x).color)}));await loc.focus();const focus=await loc.evaluate(e=>({color:getComputedStyle(e).color,outline:getComputedStyle(e).outline,focused:document.activeElement===e}));const r=await loc.boundingBox();await page.mouse.move(r.x+r.width/2,r.y+r.height/2);await page.mouse.down();const active=await loc.evaluate(e=>getComputedStyle(e).color);await page.mouse.move(1,1);await page.mouse.up();data.states.push({hover,focus,active});
           }
           await page.evaluate(()=>scrollTo(0,0));await page.screenshot({path:`results/${tag}-full.png`,fullPage:true});
           await page.locator('#bld-soundbar-guide .quick-picks').screenshot({path:`results/${tag}-cards.png`});
           await page.locator('#bld-soundbar-guide .sources').screenshot({path:`results/${tag}-sources.png`});
           data.failures=[];
           if(data.pageOverflow)data.failures.push('page overflow');
           for(const c of data.controls){if(Math.abs(c.box.h-64)>.5)data.failures.push('control height '+c.text);if(c.overflow)data.failures.push('control overflow '+c.text);if(c.color!=='rgb(255, 255, 255)')data.failures.push('control color '+c.text)}
           for(let i=0;i<5;i++){const rows=data.cards.map(c=>c.rows[i].box);if(Math.max(...rows.map(x=>x.y))-Math.min(...rows.map(x=>x.y))>1)data.failures.push('row alignment '+i);if(i===1&&Math.max(...rows.map(x=>x.h))-Math.min(...rows.map(x=>x.h))>1)data.failures.push('label heights')}
           if(data.images.some(x=>!x.loaded))data.failures.push('image not loaded');
           if(data.stacks.some(x=>x.w>320.5||x.x<data.article.x||x.right>data.article.right))data.failures.push('stack width');
           results.push({tag,...data});console.log('CHECK '+tag+' '+JSON.stringify({viewport:data.viewport,articleWidth:data.article.w,failures:data.failures,controlHeights:[...new Set(data.controls.map(x=>x.box.h))],labelHeights:data.cards.map(x=>x.rows[1].box.h),imagesLoaded:data.images.every(x=>x.loaded),headings:data.headings,states:data.states}));
           fs.writeFileSync('results/report.json',JSON.stringify(results,null,2));await ctx.close();
          }
          await browser.close();if(results.some(x=>x.failures.length))process.exitCode=1;
          
          BLD_SCRIPT
          node check-soundbar-buying-guide.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundbar-buying-guide-check
          path: results/
          retention-days: 14
