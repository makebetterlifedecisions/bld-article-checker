name: Soundbar buying guide full check
on:
  push:
    paths: ['.github/workflows/soundbar-buying-guide-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install chromium
      - name: Measure and capture whole article
        run: |
          cat > check-soundbar-buying-guide.mjs <<'BLD_SCRIPT'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('results',{recursive:true});
          const browser=await chromium.launch();
          const results=[];
          // Retain current offer evidence from the same authorised GitHub runner.
          const offerCtx=await browser.newContext(); const offerPage=await offerCtx.newPage();
          try { await offerPage.goto('https://www.jw.com.au/product/samsung-q600f-q-sers-5-1-2ch-dolby-atmos-soundbar',{waitUntil:'domcontentloaded',timeout:45000});await offerPage.waitForTimeout(1500); fs.writeFileSync('results/q600f-offer.txt',await offerPage.locator('body').innerText());await offerPage.screenshot({path:'results/q600f-offer.png',fullPage:true}); } catch(e) { fs.writeFileSync('results/q600f-offer.txt',String(e)); }
          await offerCtx.close();
          for(const config of [{w:1366,col:280},{w:1366,col:320},{w:360},{w:390},{w:480},{w:680},{w:1280},{w:1366}]){
           const tag=`${config.w}${config.col?'-column-'+config.col:''}`;
           const ctx=await browser.newContext({viewport:{width:config.w,height:1000}});const page=await ctx.newPage();
           await page.goto('https://www.betterlifedecisions.com.au/blogs/buying-guides/how-to-choose-a-soundbar?bldqa='+Date.now(),{waitUntil:'domcontentloaded'});
           await page.locator('#bld-soundbar-guide').waitFor();
           if(config.col)await page.evaluate(w=>{const el=document.querySelector('#bld-soundbar-guide');el.style.setProperty('width',w+'px','important');el.style.setProperty('max-width',w+'px','important')},config.col);
           for(let y=0;y<await page.evaluate(()=>document.documentElement.scrollHeight);y+=850){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(200);await page.screenshot({path:`results/${tag}-scroll-${String(y).padStart(6,'0')}.jpg`,type:'jpeg',quality:65})}
           await page.waitForTimeout(1000);
           fs.writeFileSync(`results/${tag}-article-text.txt`,await page.locator('#bld-soundbar-guide').innerText());
           const data=await page.evaluate(()=>{
           const root=document.querySelector('#bld-soundbar-guide');const box=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
           const controls=[...root.querySelectorAll('a.quick-button,.quick-status')].map(e=>({text:e.textContent,box:box(e),color:getComputedStyle(e).color,bg:getComputedStyle(e).backgroundColor,padding:getComputedStyle(e).padding,overflow:e.scrollWidth>e.clientWidth+1||e.scrollHeight>e.clientHeight+1,children:[...e.children].map(x=>({text:x.textContent,box:box(x),color:getComputedStyle(x).color,font:getComputedStyle(x).fontSize}))}));
           const cards=[...root.querySelectorAll('.quick-pick')].map(e=>({box:box(e),rows:[...e.children].map(x=>({cls:x.className,box:box(x),overflow:x.scrollWidth>x.clientWidth+1}))}));
           return {viewport:innerWidth,article:box(root),pageOverflow:document.documentElement.scrollWidth>innerWidth+1,controls,cards,images:[...document.querySelectorAll('.bld-article__featured img,#bld-soundbar-guide img')].map(e=>({src:e.currentSrc,loaded:e.complete&&e.naturalWidth>0,native:[e.naturalWidth,e.naturalHeight],box:box(e)})),sources:[...root.querySelectorAll('.sources a')].map(e=>({text:e.textContent,color:getComputedStyle(e).color})),headings:root.querySelectorAll('h2').length,stacks:[...root.querySelectorAll('.bldp-buy-row')].map(box)};
           });
           data.states=[];
           for(const loc of [...await page.locator('#bld-soundbar-guide a.quick-button').all(),page.locator('#bld-soundbar-guide .sources a').first()]){
           await loc.scrollIntoViewIfNeeded();await loc.hover();const hover=await loc.evaluate(e=>({color:getComputedStyle(e).color,children:[...e.children].map(x=>getComputedStyle(x).color)}));await loc.focus();const focus=await loc.evaluate(e=>({color:getComputedStyle(e).color,outline:getComputedStyle(e).outline,focused:document.activeElement===e}));const r=await loc.boundingBox();await page.mouse.move(r.x+r.width/2,r.y+r.height/2);await page.mouse.down();const active=await loc.evaluate(e=>getComputedStyle(e).color);await page.mouse.move(1,1);await page.mouse.up();data.states.push({hover,focus,active});
           }
           const cdp=await ctx.newCDPSession(page);await cdp.send('DOM.enable');await cdp.send('CSS.enable');const doc=await cdp.send('DOM.getDocument');const nodes=await cdp.send('DOM.querySelectorAll',{nodeId:doc.root.nodeId,selector:'#bld-soundbar-guide a.quick-button,#bld-soundbar-guide .sources a'});for(const nodeId of nodes.nodeIds)await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:['visited']});data.visited=await page.locator('#bld-soundbar-guide a.quick-button').evaluateAll(es=>es.map(e=>({color:getComputedStyle(e).color,children:[...e.children].map(x=>getComputedStyle(x).color)})));await cdp.detach();
           await page.evaluate(()=>{getSelection()?.removeAllRanges();scrollTo(0,0)});await page.screenshot({path:`results/${tag}-full.png`,fullPage:true});
           await page.locator('#bld-soundbar-guide .quick-picks').screenshot({path:`results/${tag}-cards.png`});
           await page.locator('#bld-soundbar-guide .sources').screenshot({path:`results/${tag}-sources.png`});
           data.keyboard=[];
           await page.evaluate(()=>{document.body.tabIndex=-1;document.body.focus()});
           for(let k=0;k<180;k++){await page.keyboard.press('Tab');const a=await page.evaluate(()=>{const e=document.activeElement;if(!e?.matches?.('#bld-soundbar-guide a'))return null;return {href:e.href,color:getComputedStyle(e).color,outlineStyle:getComputedStyle(e).outlineStyle,outlineWidth:getComputedStyle(e).outlineWidth,visible:e.matches(':focus-visible')}});if(a)data.keyboard.push(a)}
           await page.evaluate(()=>{const e=document.querySelector('#bld-soundbar-guide');e.style.setProperty('scroll-margin','20px')});
           data.extra=await page.evaluate(()=>{
            const root=document.querySelector('#bld-soundbar-guide'), box=e=>{let r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
            return {labels:[...root.querySelectorAll('.quick-label-row')].map(e=>({outer:box(e),inner:box(e.firstElementChild)})),purchase:[...root.querySelectorAll('a.quick-button')].map(e=>({href:e.href,rel:e.rel,text:e.innerText})),statusCount:root.querySelectorAll('.quick-status').length,styles:root.querySelectorAll('style').length,
            text:[...root.querySelectorAll('.quick-name,.quick-reason,.quick-label,.button-product,.button-store')].map(e=>{let r=document.createRange();r.selectNodeContents(e);return {text:e.textContent,rects:[...r.getClientRects()].map(x=>({x:x.x,right:x.right,y:x.y,bottom:x.bottom})),parent:box(e.closest('.quick-pick')||e.closest('.quick-button'))}})};
           });
           data.contentBounds=await page.evaluate(()=>{
           const root=document.querySelector('#bld-soundbar-guide'),outer=root.getBoundingClientRect(),bad=[];
           const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(!n.textContent.trim()||n.parentElement.closest('style,script'))continue;const head=n.parentElement.closest('thead');if(head){const s=getComputedStyle(head);if(s.position==='absolute'&&s.clipPath==='inset(50%)'&&head.getBoundingClientRect().width<=1.1&&head.getBoundingClientRect().height<=1.1)continue;}const range=document.createRange();range.selectNodeContents(n);for(const r of range.getClientRects()){if(r.width<1||r.height<1)continue;if(r.x<outer.x-1||r.right>outer.right+1)bad.push({text:n.textContent.slice(0,100),left:r.x,right:r.right});}}
           return bad;});
           data.failures=[];
           if(await page.locator('#bld-soundbar-guide').innerText().then(x=>!x.includes('Its live stock check was blocked')||!x.includes('A tape measure runs along a soundbar on a TV cabinet.')))data.failures.push('saved revision not visible');
           if(data.contentBounds.length)data.failures.push('article text outside bounds');
           if(!data.keyboard.some(x=>x.visible))data.failures.push('real keyboard focus missing');
           for(const k of data.keyboard)if(k.outlineStyle==='none'||parseFloat(k.outlineWidth)<1)data.failures.push('keyboard focus outline missing');
           const ls=data.extra.labels;
           if(Math.max(...ls.map(x=>x.outer.w))-Math.min(...ls.map(x=>x.outer.w))>1)data.failures.push('label widths');
           for(const l of ls)if(Math.abs((l.inner.y-l.outer.y)-(l.outer.bottom-l.inner.bottom))>1)data.failures.push('label centring');
           for(const t of data.extra.text)for(const r of t.rects)if(r.x<t.parent.x-1||r.right>t.parent.right+1||r.y<t.parent.y-1||r.bottom>t.parent.bottom+1)data.failures.push('text outside parent '+t.text);
           if(data.pageOverflow)data.failures.push('page overflow');for(const c of data.cards)for(const row of c.rows)if(row.overflow)data.failures.push('card text overflow '+row.cls);
           for(const c of data.controls){if(Math.abs(c.box.h-64)>.5)data.failures.push('control height '+c.text);if(c.overflow)data.failures.push('control overflow '+c.text);if(c.color!=='rgb(255, 255, 255)')data.failures.push('control color '+c.text)}
           for(let i=0;i<5;i++){const rows=data.cards.map(c=>c.rows[i].box);if(Math.max(...rows.map(x=>x.y))-Math.min(...rows.map(x=>x.y))>1)data.failures.push('row alignment '+i);if(i===1&&Math.max(...rows.map(x=>x.h))-Math.min(...rows.map(x=>x.h))>1)data.failures.push('label heights')}
           if(data.images.some(x=>!x.loaded))data.failures.push('image not loaded');
           if(data.stacks.some(x=>x.w>320.5||x.x<data.article.x||x.right>data.article.right))data.failures.push('stack width');
           for(const c of data.controls.slice(6).filter(c=>c.children.length===2))if(!['17px','18px'].includes(c.children[0].font))data.failures.push('detail font '+c.text);
           results.push({tag,...data});console.log('CHECK '+tag+' '+JSON.stringify({viewport:data.viewport,articleWidth:data.article.w,failures:data.failures,controlHeights:[...new Set(data.controls.map(x=>x.box.h))],labelHeights:data.cards.map(x=>x.rows[1].box.h),imagesLoaded:data.images.every(x=>x.loaded),headings:data.headings,states:data.states}));
           fs.writeFileSync('results/report.json',JSON.stringify(results,null,2));await ctx.close();
          }
          await browser.close();if(results.some(x=>x.failures.length))process.exitCode=1;
          
          BLD_SCRIPT
          node check-soundbar-buying-guide.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundbar-buying-guide-check
          path: results/
          retention-days: 14

