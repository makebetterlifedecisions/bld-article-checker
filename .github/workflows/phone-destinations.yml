name: 5G phone exact offer verification
on:
  push:
    paths: ['.github/workflows/phone-destinations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: |
          cat > phone-destinations.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('destinations',{recursive:true});
          const browser=await chromium.launch({channel:'chrome'});
          const urls=['https://link.amazon/B0iKkZfUE','https://link.amazon/B0dVlFXrQ','https://www.ebay.com.au/itm/147236054333?var=445690835436','https://www.ebay.com.au/itm/167896461980','https://www.ebay.com.au/itm/336795947381','https://www.thegoodguys.com.au/google-pixel-10a-128gb-lavender-100256738','https://www.amazon.com.au/Google-Pixel-10a-Battery-Lavender/dp/B0GGCBQWG4'];
          const rows=[];
          for(let i=0;i<urls.length;i++){const page=await browser.newPage();const chain=[];page.on('request',r=>{if(r.isNavigationRequest())chain.push(r.url())});try{await page.goto(urls[i],{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(2500);const text=await page.locator('body').innerText();fs.writeFileSync('destinations/'+i+'.txt',text);await page.screenshot({path:'destinations/'+i+'.png',fullPage:true});const row={chain,url:urls[i],final:page.url(),title:await page.title(),text:text.slice(0,20000)};rows.push(row);console.log('DEST '+JSON.stringify({...row,text:text.slice(0,6000)}))}catch(e){rows.push({url:urls[i],error:e.message})}await page.close()}
          fs.writeFileSync('destinations/report.json',JSON.stringify(rows,null,2));await browser.close();
          JS
          node phone-destinations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-destinations
          path: destinations/
          retention-days: 7

# User-requested fresh offer retry, 27 October 2026.

# Supplied 5G guide: exact marketplace and retailer verification 27 October 2026.
